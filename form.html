.tour .tb button{border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;border-radius:10px;padding:6px 12px;font:600 .9rem var(--f-body);cursor:pointer}

.mock{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--raise);font-size:.88rem;margin-top:6px}
@media (max-width:420px){.steps{grid-template-columns:1fr}.choice{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function editor(date,ed){
  return '<div class="editor"><div class="q">מה לא נכון ביום הזה?</div><div class="choice" role="group" aria-label="סוג התיקון"><button type="button" data-kind="hours" data-d="'+date+'" aria-pressed="'+(ed.kind==="hours")+'"><span>🕒</span>השעות לא נכונות</button><button type="button" data-kind="absence" data-d="'+date+'" aria-pressed="'+(ed.kind==="absence")+'"><span>🏠</span>לא עבדתי ביום הזה</button></div>'+
   (ed.kind==="hours"?'<div class="row"><label>מתי הגעת?<input type="time" data-f="in" data-d="'+date+'" value="'+esc(ed.in||"")+'"></label><label>מתי יצאת?<input type="time" data-f="out" data-d="'+date+'" value="'+esc(ed.out||"")+'"></label></div>'
    :'<label>למה לא עבדת?<select data-f="reason" data-d="'+date+'"><option value="">בחירה…</option>'+D.reasons.map(function(r){return'<option'+(r===ed.reason?" selected":"")+">"+esc(r)+"</option>"}).join("")+"</select></label>")+
   '<label>מה קרה? (חובה – כמה מילים למשרד)<textarea rows="2" maxlength="500" data-f="note" data-d="'+date+'" placeholder="למשל: שכחתי להחתים ביציאה">'+esc(ed.note||"")+"</textarea></label>"+
   (ed.kind==="hours"?'<div class="chips" aria-label="הערות מוכנות">'+NOTE_EX.map(function(x){return'<button type="button" data-ex="'+esc(x)+'" data-d="'+date+'">'+esc(x)+"</button>"}).join("")+"</div>":"")+
   (ed.err?'<p class="notice bad">'+esc(ed.err)+"</p>":"")+"</div>"}
function validate(){var ok=true;Object.keys(ED).forEach(function(k){var e=ED[k];e.err="";e.miss=false;
  if(e.kind==="absence"&&!e.reason)e.err="צריך לבחור למה לא עבדת";
  else if(e.kind==="hours"&&!e.in&&!e.out)e.err="צריך למלא מתי הגעת או מתי יצאת";
  else if(e.kind==="hours"&&e.in&&e.out&&e.out<=e.in)e.err="שעת היציאה צריכה להיות אחרי שעת ההגעה";
  else if(!String(e.note||"").trim()){e.err="צריך לכתוב הערה קצרה – מה קרה";e.miss=true}
  if(e.err)ok=false});return ok}
function confirmView(){
  var items=Object.keys(ED).sort().map(function(k){var e=ED[k];return"<li><b>"+(+k.slice(8))+"/"+(+k.slice(5,7))+"</b>: "+(e.kind==="absence"?"לא עבדתי ("+esc(e.reason)+")":"שעות: "+[e.in&&"הגעה "+e.in,e.out&&"יציאה "+e.out].filter(Boolean).join(", "))+'<br><span class="sub">הערה: '+esc(e.note)+"</span></li>"}).join("");
  app.innerHTML='<div class="card"><h1>בדיקה אחרונה לפני השליחה</h1><p>אלה התיקונים שיישלחו למשרד:</p><ul>'+items+'</ul><p class="sub">המשרד יבדוק ויאשר. תקבלי מייל כשתתקבל החלטה.</p><p class="notice bad" id="serr" hidden></p></div>';
  bar('<button class="btn" type="button" id="back">חזרה לתיקונים</button><button class="btn primary" type="button" id="go">כן, לשלוח למשרד</button>')}
function doneView(n){view="done";
  app.innerHTML='<div class="card">'+brandHead()+'<h1>✓ נשלח בהצלחה</h1><p class="notice ok">'+n+' תיקונים התקבלו במשרד. תקבלי מייל כשיאושרו או יידחו.</p><p class="sub">אפשר לחזור לטופס ולשנות, כל עוד המשרד לא טיפל בבקשות.</p></div>';
  bar('<button class="btn" type="button" id="reload">חזרה לטופס</button>')}
function submit(){if(busy)return;busy=true;var b=document.getElementById("go");b.disabled=true;b.textContent="שולח…";
  var days=Object.keys(ED).sort().map(function(k){var e=ED[k];return e.kind==="absence"?{date:k,kind:"absence",reason:e.reason,note:e.note.trim()}:{date:k,kind:"hours",in:e.in||"",out:e.out||"",note:e.note.trim()}});
  if(DEMO){setTimeout(function(){busy=false;doneView(days.length)},600);return}
  call("formSubmit",T,JSON.stringify({days:days})).then(function(n){busy=false;doneView(n)})
  .catch(function(e){busy=false;b.disabled=false;b.textContent="כן, לשלוח למשרד";var x=document.getElementById("serr");x.textContent=e.message;x.hidden=false})}

function showHelp(){view="help";bar("");
  app.innerHTML='<div class="card">'+brandHead()+'<h1>איך מעדכנים את הנוכחות?</h1><p>בסוף כל חודש מגיע אלייך מייל עם כל השעות שלך. אם הכל נכון – לא צריך לעשות כלום. אם יש טעות – מתקנים בטופס תוך דקה.</p>'+
   '<button class="btn primary" type="button" id="tourBtn">▶ צפייה בהדגמה (דקה)</button></div>'+
   '<div class="card"><h2>שלב אחר שלב</h2>'+
   '<div class="hstep"><i>1</i><div><b>פותחים את המייל</b> "דיווח הנוכחות שלך" ולוחצים על הכפתור <b>"לעדכון הנוכחות"</b>.</div></div>'+
   '<div class="hstep"><i>2</i><div><b>בודקים את הימים.</b> ימים עם החתמה חסרה מסומנים בצהוב.<div class="mock">12 · יום שלישי · 07:32 עד ? <span class="pill wait">⚠ חסרה החתמה</span></div></div></div>'+
   '<div class="hstep"><i>3</i><div>ליד יום עם טעות לוחצים <b>"יש טעות? תיקון"</b>.</div></div>'+
   '<div class="hstep"><i>4</i><div>בוחרים <b>"השעות לא נכונות"</b> ומתקנים את שעת ההגעה או היציאה, או בוחרים <b>"לא עבדתי ביום הזה"</b> ואת הסיבה.</div></div>'+
   '<div class="hstep"><i>5</i><div>כותבים <b>הערה קצרה</b> – מה קרה (אפשר ללחוץ על הערה מוכנה, למשל "שכחתי להחתים").</div></div>'+
   '<div class="hstep"><i>6</i><div>לוחצים <b>"המשך לשליחה למשרד"</b>, בודקים ומאשרים. המשרד מאשר ושולח לך מייל.</div></div></div>'+
   '<div class="card"><h2>שאלות נפוצות</h2><ul><li><b>הכל נכון, מה עושים?</b> כלום. אין צורך לשלוח.</li><li><b>טעיתי בשליחה?</b> אפשר לפתוח שוב את הקישור, לתקן ולשלוח שוב – זה מחליף את הקודם, כל עוד המשרד לא טיפל.</li><li><b>הקישור לא עובד?</b> הוא תקף כ-12 ימים אחרי סוף החודש. אפשר לבקש מהמשרד קישור חדש.</li><li><b>אפשר מהטלפון?</b> כן, הטופס מותאם לטלפון.</li></ul></div>'}
var TOUR=null;
function startTour(){if(!DEMO){REAL={D:D,ED:ED,only:only};DEMO=true}D=demoData();ED={};only=false;view="list";render();
  var k=Object.keys(D.days),miss=k[3]?D.month+"-"+k[3]:D.month+"-"+k[0],ab=D.month+"-"+k[5];
  var steps=[
   {t:"זה הטופס שנפתח מהמייל",d:"בראש הדף רואים כמה ימים ושעות עבדת החודש.",el:function(){return document.querySelector(".sum")}},
   {t:"אם הכל נכון – לא צריך לעשות כלום",d:"אפשר פשוט לסגור את הדף.",el:function(){return document.querySelector(".allok")}},
   {t:"יום עם החתמה חסרה מסומן בצהוב",d:"כאן חסרה שעת יציאה.",el:function(){return document.querySelector('[data-date="'+miss+'"]')}},
   {t:"לוחצים \"יש טעות? תיקון\"",d:"נפתח חלון קטן לתיקון היום.",el:function(){return document.querySelector('[data-tog="'+miss+'"]')},act:function(e){e.click()}},
   {t:"ממלאים את השעה הנכונה",d:"כאן: יצאתי ב-13:15.",el:function(){return document.querySelector('[data-d="'+miss+'"][data-f="out"]')},act:function(e){e.value="13:15";e.dispatchEvent(new Event("input",{bubbles:true}))}},
   {t:"כותבים הערה קצרה למשרד",d:"אפשר ללחוץ על הערה מוכנה.",el:function(){return document.querySelector('[data-d="'+miss+'"][data-ex]')},act:function(e){e.click()}},
   {t:"יום שלא עבדת? בוחרים \"לא עבדתי\"",d:"לוחצים תיקון ליד היום ובוחרים את הסיבה.",el:function(){return document.querySelector('[data-tog="'+ab+'"]')},act:function(e){e.click();setTimeout(function(){var b=document.querySelector('[data-kind="absence"][data-d="'+ab+'"]');b&&b.click();setTimeout(function(){var s=document.querySelector('[data-d="'+ab+'"][data-f="reason"]');if(s){s.value="מחלה";s.dispatchEvent(new Event("change",{bubbles:true}))}var n=document.querySelector('[data-d="'+ab+'"][data-f="note"]');if(n){n.value="הייתי חולה, אישור יגיע";n.dispatchEvent(new Event("input",{bubbles:true}))}},350)},350)}},
   {t:"בסוף לוחצים \"המשך לשליחה למשרד\"",d:"למטה רואים כמה ימים מתוקנים.",el:function(){return document.getElementById("send")},act:function(e){e.click()}},
   {t:"בודקים ומאשרים",d:"המשרד יקבל את התיקונים ויאשר. תקבלי מייל עם ההחלטה.",el:function(){return document.getElementById("go")},act:function(e){e.click()}},
   {t:"זהו! סיימנו",d:"ככה פשוט. עכשיו אפשר לחזור לטופס האמיתי.",el:function(){return document.querySelector(".notice.ok")}}];
  var hand=document.createElement("div");hand.className="hand";hand.style.left="50%";hand.style.top="40%";document.body.appendChild(hand);
  var box=document.createElement("div");box.className="tour";box.setAttribute("role","status");box.setAttribute("aria-live","polite");document.body.appendChild(box);
  var i=0,timer=null,paused=false;
  function end(){clearTimeout(timer);hand.remove();box.remove();document.querySelectorAll(".glow").forEach(function(x){x.classList.remove("glow")});TOUR=null;DEMO=false;
    if(T==="help"){D=demoData();ED={};showHelp();return}if(REAL){D=REAL.D;ED=REAL.ED;only=REAL.only;REAL=null}view="list";render()}
  function step(){document.querySelectorAll(".glow").forEach(function(x){x.classList.remove("glow")});if(i>=steps.length){box.querySelector("[data-tq]").textContent="סגירת ההדגמה";return}
    var s=steps[i],el=s.el();box.innerHTML='<b>'+(i+1)+". "+esc(s.t)+'</b><span>'+esc(s.d)+'</span><div class="tb"><div class="prog"><i style="width:'+Math.round((i+1)/steps.length*100)+'%"></i></div><button type="button" data-tp>'+(paused?"▶ המשך":"❚❚ השהיה")+'</button><button type="button" data-tq>'+(i===steps.length-1?"חזרה לטופס":"דילוג")+"</button></div>";
    if(el){var r0=el.getBoundingClientRect();window.scrollBy({top:r0.top-window.innerHeight*0.25,behavior:"smooth"});setTimeout(function(){var r=el.getBoundingClientRect();hand.style.left=(window.innerWidth-r.right+r.width/2-17)+"px";hand.style.top=(r.top+r.height/2)+"px";hand.style.right="auto";hand.style.left=(r.left+r.width/2-17)+"px";el.classList.add("glow");
      if(s.act)setTimeout(function(){hand.classList.add("tap");setTimeout(function(){hand.classList.remove("tap");try{s.act(el)}catch(e){}},220)},900)},450)}
    i++;if(!paused)timer=setTimeout(step,s.act?4200:3400)}
  box.addEventListener("click",function(ev){if(ev.target.closest("[data-tq]"))return end();if(ev.target.closest("[data-tp]")){paused=!paused;ev.target.textContent=paused?"▶ המשך":"❚❚ השהיה";if(paused)clearTimeout(timer);else step()}});
  TOUR={end:end};step()}
document.addEventListener("click",function(ev){var t=ev.target,el;
  if(TOUR&&ev.isTrusted&&!t.closest(".tour"))return;
  if(t.closest("#tourBtn")){startTour();return}
  if((el=t.closest("[data-only]"))){only=el.dataset.only==="1";render();return}
  if((el=t.closest("[data-tog]"))){var d=el.dataset.tog;if(ED[d])delete ED[d];else{var en=D.days[d.slice(8)]||[];ED[d]=D.absent[d.slice(8)]?{kind:"absence",reason:D.absent[d.slice(8)].reason,note:""}:{kind:"hours",in:firstIn(en),out:lastOut(en),note:""}}render();if(ED[d]&&!TOUR){var n=document.querySelector('[data-d="'+d+'"][data-f="'+(ED[d].kind==="hours"&&!ED[d].out?"out":"note")+'"]');n&&n.focus()}return}
  if((el=t.closest("[data-kind]"))){ED[el.dataset.d].kind=el.dataset.kind;render();return}
  if((el=t.closest("[data-ex]"))){var e=ED[el.dataset.d];if(!e)return;e.note=el.dataset.ex;e.err="";e.miss=false;render();return}
  if(t.id==="send"){if(!validate()){render();var f=document.querySelector(".miss textarea,.editor .notice.bad");f&&f.scrollIntoView({block:"center"});return}confirmView();return}
  if(t.id==="back"){view="list";render();return}
  if(t.id==="bigTxt"){big=!big;setBig();render();return}
  if(t.id==="go"){submit();return}
  if(t.id==="reload"){if(DEMO)return;load();return}
});
document.addEventListener("input",function(ev){var t=ev.target;if(!t.dataset.d||!ED[t.dataset.d])return;ED[t.dataset.d][t.dataset.f]=t.value;if(ED[t.dataset.d].err&&t.dataset.f==="note"&&t.value.trim()){ED[t.dataset.d].err="";var p=t.closest(".day");p.classList.remove("miss");var x=p.querySelector(".notice.bad");x&&x.remove()}});
document.addEventListener("change",function(ev){var t=ev.target;if(t.dataset.d&&ED[t.dataset.d]&&t.tagName==="SELECT")ED[t.dataset.d][t.dataset.f]=t.value});
document.addEventListener("keydown",function(ev){if(ev.key==="Escape"&&TOUR)TOUR.end()});
load();
})();
</script>
