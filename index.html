<style>

    get:async()=>{await waitLoaded(ci.t);const d=tbl(ci.t).docs.get(id);return{id,exists:!!d,data:()=>d}},

async function moeLoad(){const file=await pickFile(".xlsx,.xls,.csv");if(!file)return;let X;try{X=await readSheetX(file)}catch(e){toast("לא ניתן לקרוא את הקובץ. נסו לשמור אותו מחדש כ-xlsx");return}
  const aoa=X.aoa.filter(r=>r.some(c=>String(c).trim()));if(!aoa.length){toast("הקובץ ריק");return}
  const isId=v=>{const d=digits(v);return d.length>=5&&d.length<=9&&/^[\d\s-]+$/.test(String(v).trim())};
  const hit=(h,...a)=>{const n=norm(h);return a.some(x=>n.includes(x))};
  let hr=-1;for(let i=0;i<Math.min(25,aoa.length);i++){if(aoa[i].some(c=>hit(c,"תז","זהות","מספרזהות","תעודת")))  {hr=i;break}}
  let H,rows;
  if(hr>=0){H=aoa[hr].map(String);rows=aoa.slice(hr+1)}else{H=aoa[0].map((_,i)=>"עמודה "+(i+1));rows=aoa}
  const col=(...a)=>H.findIndex(h=>hit(h,...a));
  let cId=hr>=0?H.findIndex(h=>hit(h,"תזתלמיד","תזהתלמיד","תזילד","מספרזהותתלמיד")):-1;if(cId<0&&hr>=0)cId=H.findIndex(h=>hit(h,"תז","זהות")&&!hit(h,"אב","אם","הורה"));
  if(cId<0){const w=Math.max(...rows.map(r=>r.length));let best=-1,bs=0;for(let c=0;c<w;c++){const v=rows.map(r=>r[c]).filter(x=>String(x).trim());const sc=v.filter(isId).length/(v.length||1);if(v.length>=2&&sc>bs){bs=sc;best=c}}if(bs>.6)cId=best}
  if(cId<0){toast("לא נמצאה עמודת תעודת זהות בקובץ");return}
  const hFirst=col("שםפרטי","פרטי"),hLast=col("שםמשפחה","משפחה"),hName=col("שםמלא","שםהתלמיד","שםהילד","שםתלמיד"),hSym=col("סמלמוסד","סמל");
  const cell=(r,c)=>c>=0?String(r[c]??"").trim():"";
  const sys=new Map(vals("children").filter(c=>c.id_number&&isOn(c.is_active)).map(c=>[normId(c.id_number),c]));const seen=new Set();const out={file:file.name,matched:0,missing:[],extra:[],diff:[]};
  rows.forEach(r=>{const raw=cell(r,cId);if(!isId(raw))return;const id=normId(raw);if(!id||seen.has(id))return;seen.add(id);
    const name=hName>=0?cell(r,hName):[cell(r,hFirst),cell(r,hLast)].filter(Boolean).join(" ");const sym=cell(r,hSym);const c=sys.get(id);
    if(!c){out.missing.push({id,name,symbol:sym,note:"מופיע בקובץ המשרד בלבד"});return}
    const notes=[];if(sym&&c.symbol&&sym!==String(c.symbol))notes.push(`סמל: במשרד ${sym}, במערכת ${c.symbol}`);
    if(hLast>=0&&cell(r,hLast)&&c.last_name&&cell(r,hLast)!==c.last_name)notes.push(`שם משפחה: במשרד ${cell(r,hLast)}, במערכת ${c.last_name}`);
    notes.length?out.diff.push({id,name:fullName(c),symbol:c.symbol,note:notes.join(" · ")}):out.matched++});
  if(!seen.size){toast("לא נמצאו מספרי זהות תקינים בקובץ");return}
  sys.forEach((c,id)=>{if(!seen.has(id))out.extra.push({id,name:fullName(c),symbol:c.symbol,note:c.teacher_name?"גננת: "+c.teacher_name:""})});
  moe=out;tab.moe="missing";render();audit("השוואת משרד החינוך","ילדים",file.name)}

function readNote(){const d=noteDraft,box=$("#modal");if(!d||!$("#nt"))return;if(d.share==="some")d.share_with=[...box.querySelectorAll("[data-nshw]:checked")].map(i=>i.value);d.title=$("#nt").value;d.content=$("#nx").value;d.category_id=$("#nc").value;d.pinned=$("#np").checked;

function fitNote(data){let t=data.table,cut=0;const size=()=>JSON.stringify(data).length;

const readF=(file,how)=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=()=>rej(new Error("לא ניתן לקרוא את "+file.name));how==='text'?fr.readAsText(file,'utf-8'):fr.readAsArrayBuffer(file)});
const cellStr=v=>v instanceof Date?(isNaN(v)?"":v.toLocaleDateString("he-IL")):v==null?"":String(v);
async function fileToNotes(file){const name=file.name,ext=(name.split(".").pop()||"").toLowerCase(),base=name.replace(/\.[^.]+$/,"");
  if(file.size>8e6)throw new Error(`${name}: הקובץ גדול מדי (עד 8MB)`);
  if(["txt","md"].includes(ext))return[{title:base,content:await readF(file,'text'),file_name:name}];
  if(ext==="json"){const txt=await readF(file,'text');let j;try{j=JSON.parse(txt)}catch(e){return[{title:base,content:txt,file_name:name}]}
    if(Array.isArray(j)&&j.length&&typeof j[0]==="object"){const cols=[...new Set(j.flatMap(o=>Object.keys(o||{})))];return[{title:base,content:"",file_name:name,table:{cols,rows:j.map(o=>cols.map(c=>cellStr(typeof o[c]==="object"?JSON.stringify(o[c]):o[c])))}}]}
    return[{title:base,content:JSON.stringify(j,null,2),file_name:name}]}
  await ensureXLSX();const wb=["csv","tsv"].includes(ext)?XLSX.read((await readF(file,'text')).replace(/^\uFEFF/,""),{type:"string",raw:true,FS:ext==="tsv"?"\t":undefined}):XLSX.read(await readF(file,'buf'),{type:"array",cellDates:true});
  return wb.SheetNames.map(sn=>{const aoa=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,defval:"",raw:false}).map(r=>r.map(cellStr)).filter(r=>r.some(v=>v.trim()));
    if(!aoa.length)return null;const w=Math.max(...aoa.map(r=>r.length));const pad=r=>{const a=[...r];while(a.length<w)a.push("");return a};
    return{title:wb.SheetNames.length>1?base+" – "+sn:base,content:"",file_name:name,table:{cols:pad(aoa[0]).map((c,i)=>c||"עמודה "+(i+1)),rows:aoa.slice(1).map(pad)}}}).filter(Boolean)}
async function importNoteFiles(files){const all=[];for(const f of files){try{all.push(...await fileToNotes(f))}catch(e){toast(e.message||("לא ניתן לקרוא את "+f.name))}}
  if(!all.length)return;all.forEach(n=>n.category_id=noteCat||"");

  let cut=0;for(const n of all){cut+=fitNote(n);await save({col:"notes"},null,n)}toast(`נוצרו ${all.length} פתקים מהקבצים${cut?" (חלק מהטבלאות קוצרו)":""}`)}

function propagate(col,before,after){const S2=[];const g=after.garden_id&&S.gardens?.get(after.garden_id);
  if(col==="children"&&g&&after.garden_id!==(before?.garden_id||"")){const ch={};if(g.name&&after.garden_name!==g.name)ch.garden_name=g.name;if(g.symbol&&String(after.symbol||"")!==String(g.symbol))ch.symbol=g.symbol;if(g.manager_name&&after.teacher_name!==g.manager_name)ch.teacher_name=g.manager_name;
    if(Object.keys(ch).length)S2.push({l:`לעדכן אצל ${fullName(after)} את פרטי הגן החדש (${Object.entries(ch).map(([k,v])=>colLabelOf(defOf("children"),k)+": "+v).join(", ")})`,run:()=>save(E.children,after._id,ch)})}
  if(col==="gardens"&&before){const kids=vals("children").filter(c=>c.garden_id===after._id||(!c.garden_id&&((before.symbol&&String(c.symbol)===String(before.symbol))||(before.name&&c.garden_name===before.name))));
    const map=[["name","garden_name"],["symbol","symbol"],["manager_name","teacher_name"]].filter(([a])=>(before[a]||"")!==(after[a]||""));
    if(map.length&&kids.length)S2.push({l:`לעדכן ${kids.length} ילדים בגן (${map.map(([a])=>colLabelOf(defOf("gardens"),a)).join(", ")})`,run:()=>pool(kids.map(c=>()=>save(E.children,c._id,Object.fromEntries(map.map(([a,b])=>[b,after[a]||""])))),()=>{})});
    if(after.manager_name&&after.manager_name!==before.manager_name){const sm=vals("staff").find(x=>x.full_name===after.manager_name);if(sm&&sm.garden_id!==after._id)S2.push({l:`לשייך את ${sm.full_name} לגן ${after.name} ברשימת הצוות`,run:()=>save(E.staff,sm._id,{garden_id:after._id})})}}
  if(col==="staff"&&before){if(before.full_name&&after.full_name&&before.full_name!==after.full_name){const gs=vals("gardens").filter(x=>x.manager_name===before.full_name),ks=vals("children").filter(c=>c.teacher_name===before.full_name);
      if(gs.length||ks.length)S2.push({l:`להחליף את השם "${before.full_name}" ב"${after.full_name}" ב-${gs.length} גנים וב-${ks.length} ילדים`,run:()=>pool([...gs.map(x=>()=>save(E.gardens,x._id,{manager_name:after.full_name})),...ks.map(c=>()=>save(E.children,c._id,{teacher_name:after.full_name}))],()=>{})})}
    const isT=(after.roles||[]).some(r=>/גננת/.test(r));
    if(g&&isT&&after.garden_id!==before.garden_id&&g.manager_name!==after.full_name){const ks=kidsOf(g);S2.push({l:`לרשום את ${after.full_name} כגננת של ${g.name}${ks.length?` ולעדכן ${ks.length} ילדים`:""}`,run:()=>pool([()=>save(E.gardens,g._id,{manager_name:after.full_name}),...ks.map(c=>()=>save(E.children,c._id,{teacher_name:after.full_name}))],()=>{})})}}
  if(!S2.length)return;
  setTimeout(()=>{modal(`<h2>לעדכן גם במקומות אחרים?</h2><p class="sub">השינוי ששמרת קשור לנתונים במסכים נוספים. סמנו מה לעדכן:</p><div class="list prop">${S2.map((x,i)=>`<label class="li"><input type="checkbox" data-pi="${i}" checked><span class="t">${esc(x.l)}</span></label>`).join("")}</div>

   <section class="card col"><div class="row" style="justify-content:space-between"><h2>${ico("search")} סקירת הרשאות תקופתית</h2>${rev?`<span class="pill ${revAge<=183?"ok":"warn"}">סקירה אחרונה: ${esc(fmtDate(rev.date.slice(0,10)))} (${esc(rev.by)})</span>`:'<span class="pill warn">עוד לא בוצעה סקירה</span>'}</div>
    <p class="sub">בודקים שלכל מי שמופיעה כאן עדיין יש צורך בגישה, ושמי שעזבה סומנה כלא פעילה.</p>
    <div class="tbox"><table><thead><tr><th>שם</th><th>אימייל</th><th>תפקיד</th><th>גישה</th><th>כניסה אחרונה</th><th>מחוברת עכשיו</th><th>סטטוס</th></tr></thead><tbody>${SEC.users.map(u=>`<tr><td><b>${esc(u.name||"")}</b></td><td class="mono">${esc(u.email||"")}</td><td>${esc(u.role||"")}</td><td class="sub">${esc(u.areas.map(a=>AREA_L[a]).join(", ")||"משימות וצ'אט בלבד")}</td><td>${u.last_login?esc(fmtTs(u.last_login)):'<span class="sub">לא נכנסה</span>'}</td><td>${u.sessions?`<span class="pill ok">${u.sessions}</span>`:""}</td><td>${u.active?'<span class="pill ok">פעילה</span>':'<span class="pill">לא פעילה</span>'}</td></tr>`).join("")}</tbody></table></div>
    <div class="row"><label class="sr" for="revNote">הערה לסקירה</label><input id="revNote" style="flex:1" placeholder="הערה (לא חובה): למשל, הוסרה גישה של…"><button class="btn primary" data-x="revDo">${ico("check")}אישור: ביצעתי סקירת הרשאות</button><a class="btn" href="#office">לניהול צוות המשרד</a></div></section>
   <div class="hcols"><section class="card col"><div class="row" style="justify-content:space-between"><h2>${ico("folder")} גיבויים</h2><button class="btn sm" data-x="bkNow">${ico("refresh")}גיבוי עכשיו</button></div>
     ${SEC.backups.length?`<ul class="secl">${SEC.backups.slice(0,6).map(b=>`<li class="ok">${ico("check")}<span>${b.url?`<a href="${esc(b.url)}" target="_blank" rel="noopener">${esc(b.name)}</a>`:esc(b.name)}</span></li>`).join("")}</ul>`:'<p class="sub">עוד אין גיבויים. גיבוי נוצר אוטומטית כל יום בבוקר.</p>'}</section>
    <section class="card col"><div class="row" style="justify-content:space-between"><h2>${ico("alert")} אירועי אבטחה</h2><button class="btn sm" data-x="incNew">${ico("plus")}תיעוד אירוע</button></div>
     <p class="sub">כל אירוע מתועד כאן (למשל: מייל שנשלח לנמען שגוי, מכשיר שאבד, חשד לגישה לא מורשית). <b>אירוע אבטחה חמור יש לדווח לרשות להגנת הפרטיות באופן מיידי.</b></p>
     ${SEC.incidents.length?`<ul class="secl">${SEC.incidents.slice(0,10).map(i=>`<li class="${i.severity==="חמורה"?"no":""}"><button class="linkish" data-x="incEdit" data-id="${i._id}"><b>${esc(i.title)}</b><small>${esc(fmtDate(String(i.date).slice(0,10)))} · חומרה: ${esc(i.severity)}${i.reported?" · דווח לרשות":""}</small></button></li>`).join("")}</ul>`:'<p class="sub">לא תועדו אירועים.</p>'}</section></div>
   <section class="card col"><h2>${ico("info")} יומן פעולות ושמירת מידע</h2><ul class="howto"><li>יומן הפעולות נשמר לפי חודשים (${SEC.audit_months.length} חודשים כרגע) ואינו ניתן למחיקה מתוך המערכת. מומלץ לשמור לפחות 24 חודשים.</li><li>כל כניסה, צפייה ברשימות הילדים והצוות, הצגת ת.ז., ייצוא ומחיקה נרשמים. <a href="#audit">לצפייה ביומן</a></li><li>מידע על ילדים שאינם פעילים יותר משנתיים: <a href="#health">בדיקה ומחיקה במסך איכות הנתונים</a>.</li></ul>
    <p class="notice info">${ico("info")}<span>ההנחיות כאן הן כלי עזר טכני ואינן ייעוץ משפטי. כדאי לאשר את מסמכי המאגר והנוהל מול יועץ/ת פרטיות.</span></p></section>`};
function incEdit(id){const i=id?SEC.incidents.find(x=>x._id===id):{};modal(`<h2>${id?"אירוע אבטחה":"תיעוד אירוע אבטחה"}</h2><fieldset><label class="f full">מה קרה?<input id="inT" value="${esc(i.title||"")}"></label><label class="f">מתי?<input type="date" id="inD" value="${esc(String(i.date||today()).slice(0,10))}"></label>
  <label class="f">חומרה<select id="inS">${["נמוכה","בינונית","חמורה"].map(x=>`<option${x===(i.severity||"נמוכה")?" selected":""}>${x}</option>`).join("")}</select></label><label class="f full">פירוט<textarea id="inX" rows="3">${esc(i.details||"")}</textarea></label>
  <label class="f full">מה נעשה בעקבות האירוע?<textarea id="inA" rows="2">${esc(i.actions||"")}</textarea></label><label class="f chk"><input type="checkbox" id="inR"${i.reported?" checked":""}> דווח לרשות להגנת הפרטיות</label></fieldset>
  <p class="notice warn">אירוע חמור (דליפה של מידע על ילדים, גישה לא מורשית למאגר) מחייב דיווח מיידי לרשות להגנת הפרטיות.</p><p class="notice bad" id="inE" hidden></p><div class="row"><button class="btn primary" id="inGo">שמירה</button><button class="btn" data-close>ביטול</button></div>`);
  $("#inGo").onclick=e=>busy(e.currentTarget,async()=>{try{await call("secIncident",{id:id||"",title:$("#inT").value,date:$("#inD").value,severity:$("#inS").value,details:$("#inX").value,actions:$("#inA").value,reported:$("#inR").checked});closeModal();toast("האירוע תועד");SEC=null;render()}catch(err){$("#inE").textContent=err.message;$("#inE").hidden=false}})}
document.addEventListener("click",e=>{const el=e.target.closest("[data-x]");if(!el)return;const x=el.dataset.x;
  if(x==="raSave"){const ra={};document.querySelectorAll("[data-ra]").forEach(i=>{const[r,a]=i.dataset.ra.split("|");(ra[r]=ra[r]||[]);if(i.checked)ra[r].push(a)});return busy(el,async()=>{try{await saveSettings({role_access:ra});SEC.roles=ra;toast("ההרשאות נשמרו");audit("שינוי הרשאות לפי תפקיד","אבטחה","",JSON.stringify(ra).slice(0,180))}catch(err){toast(err.message)}})}
  if(x==="revDo")return busy(el,async()=>{try{SEC.review=await call("secReview",{note:$("#revNote").value});toast("הסקירה נרשמה");render()}catch(err){toast(err.message)}});
  if(x==="bkNow")return busy(el,async()=>{try{const r=await call("secBackupNow");toast("נוצר גיבוי: "+r.name);SEC=null;render()}catch(err){toast(err.message)}});
  if(x==="incNew")return incEdit(null);if(x==="incEdit")return incEdit(el.dataset.id)});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.secck){const k=t.dataset.secck;const ck={...(settings.sec_checklist||{})};if(t.checked)ck[k]=new Date().toISOString();else delete ck[k];saveSettings({sec_checklist:ck}).then(()=>{if(SEC)SEC.checklist=ck;render()}).catch(x=>toast(x.message))}});

(()=>{const os=showLogin;showLogin=function(m){os(m);const c=$(".logincard");if(c&&!c.querySelector(".privnote")){const p=document.createElement("p");p.className="privnote sub";p.innerHTML=`${ico("lock")} המערכת מכילה מידע אישי על ילדים ועובדות, ומאובטחת לפי תקנות הגנת הפרטיות. כל כניסה ופעולה נרשמות ביומן.`;c.appendChild(p)}}})();

(async()=>{
  let lk=window.KG_LOGIN||"";try{const u=new URL(location.href);if(!lk)lk=u.searchParams.get("login")||"";if(u.searchParams.get("login")){u.searchParams.delete("login");history.replaceState(null,"",u.pathname+u.search+u.hash)}}catch(e){}
  if(lk){try{const r=await pub("linkLogin",lk);setToken(r.token);return start(r.me)}catch(e){return showLogin(e.message)}}
  if(!TOKEN)return showLogin();
  try{start(await call("me"))}catch(e){if(e.code!=="auth")showLogin("לא ניתן להתחבר לשרת: "+e.message)}
})();
})();
</script>
</body></html>
